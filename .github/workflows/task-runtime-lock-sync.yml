name: Task runtime lock sync

on:
  push:
    branches:
      - feat/task-runtime-mvp

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/task-runtime-mvp
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          git commit -m "Update Bun lockfile for task runtime"
          git push origin HEAD:feat/task-runtime-mvp
