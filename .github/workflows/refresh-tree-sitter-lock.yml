name: Refresh Tree-sitter lockfile

on:
  push:
    branches:
      - feat/swift-vue-coverage

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/swift-vue-coverage
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - name: Commit lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh Tree-sitter lockfile"
          git push origin HEAD:feat/swift-vue-coverage
