name: Prepare language coverage branch

on:
  push:
    branches:
      - feat/swift-vue-coverage

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/swift-vue-coverage
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rename logical operation metric and refresh lockfile
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("extensions/session-metrics/src/analyze.ts")
          source = path.read_text()

          old_init = "      successes: 0,"
          assert source.count(old_init) == 1
          source = source.replace(old_init, "      errorFree: 0,\n      successes: 0,")

          old_increment = "        result.logicalOperations.successes += operationErrors === 0 ? 1 : 0;"
          assert source.count(old_increment) == 2
          source = source.replace(
              old_increment,
              "        const errorFree = operationErrors === 0 ? 1 : 0;\n"
              "        result.logicalOperations.errorFree += errorFree;\n"
              "        result.logicalOperations.successes += errorFree;",
          )

          old_merge = "  target.logicalOperations.successes += source.logicalOperations.successes;"
          assert source.count(old_merge) == 1
          source = source.replace(
              old_merge,
              "  target.logicalOperations.errorFree += source.logicalOperations.errorFree;\n"
              "  target.logicalOperations.successes += source.logicalOperations.successes;",
          )

          path.write_text(source)
          PY
          bun install
      - run: bun run check
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extensions/session-metrics/src/analyze.ts bun.lock
          git commit -m "fix: expose error-free logical operations"
          git push origin HEAD:feat/swift-vue-coverage
